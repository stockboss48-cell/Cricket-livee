<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cricket Countries</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width:800px; margin:30px auto; padding:0 16px; }
    ul { padding-left:1rem; }
  </style>
</head>
<body>
  <h1>Cricket Countries</h1>
  <div id="status">Loading...</div>
  <ul id="countries"></ul>

  <script>
    async function loadCountries(){
      const url = "https://api.cricapi.com/v1/countries?apikey=bd7f9444-24c4-465a-8c7f-88319836d530&offset=0";
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const json = await res.json();
        const list = document.getElementById('countries');
        document.getElementById('status').textContent = '';
        list.innerHTML = '';
        if (!json.data || !json.data.length) {
          document.getElementById('status').textContent = 'No data returned';
          return;
        }
        json.data.forEach(c => {
          const li = document.createElement('li');
          li.textContent = c.name + (c.id ? ' (id: ' + c.id + ')' : '');
          list.appendChild(li);
        });
      } catch (err) {
        document.getElementById('status').textContent = 'Error loading: ' + err.message;
        console.error(err);
      }
    }
    loadCountries();
  </script>
</body>
</html>
